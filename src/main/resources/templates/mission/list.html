<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>심부름 전체 내역 - 집콕</title>
    <th:block th:replace="~{fragments/header :: header}"></th:block>
    <link rel="stylesheet" th:href="@{/css/mission/missionList.css}">
</head>
<body>

<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container">
    <!-- 헤더 -->
    <div class="page-header">
        <button class="back-btn" onclick="location.href='/zipkok/member/mypage'">
            <i class="fas fa-arrow-left" style="font-size: 18px;"></i>
        </button>
        <div class="page-title">
            <h2 th:text="${history == 'request' ? '요청 내역' : '수행 내역'}">요청 내역</h2>
            <p class="page-subtitle">전체 심부름 내역을 확인하고 관리하세요</p>
        </div>
    </div>

    <!-- 검색 및 필터 -->
    <div class="filter-section">
        <form th:action="@{/zipkok/mission/add}" method="get">
            <input type="hidden" name="flag" th:value="${flag}">

            <!-- 검색 -->
            <div class="filter-row">
                <div class="search-box">
                    <input type="text"
                           name="search"
                           th:value="${search}"
                           placeholder="심부름 제목으로 검색하세요...">
                    <button type="submit" class="search-btn">
                        <i class="fas fa-search"></i>
                    </button>
                </div>

                <select name="sort" class="sort-select" onchange="this.form.submit()">
                    <option value="recent">최신순</option>
                    <option value="old">오래된순</option>
                    <option value="price_high">가격높은순</option>
                    <option value="price_low">가격낮은순</option>
                </select>
            </div>

            <!-- 상태 필터 -->
            <div class="filter-row">
                <div class="status-filters">
                    <button type="button" class="status-chip active" onclick="filterStatus('')">
                        전체
                    </button>
                    <button type="button" class="status-chip" onclick="filterStatus('0')">
                        신청
                    </button>
                    <button type="button" class="status-chip" onclick="filterStatus('1')">
                        진행중
                    </button>
                    <button type="button" class="status-chip" onclick="filterStatus('2')">
                        완료
                    </button>
                    <button type="button" class="status-chip" onclick="filterStatus('9')">
                        취소
                    </button>
                </div>
            </div>
        </form>
    </div>

    <!-- 리스트 -->
    <div class="list-container">
        <div class="list-header">
            <span th:text="${history == 'request' ? '내가 요청한 심부름' : '내가 수행한 심부름'}">내가 요청한 심부름</span>
            <span class="list-count" th:if="${paging != null}">
                총 [[${paging.totalCount}]]건
            </span>
        </div>

        <!-- 데이터가 없을 때 -->
        <div th:if="${#lists.isEmpty(lists)}" class="empty-state">
            <div class="empty-icon">
                <i class="fas fa-inbox"></i>
            </div>
            <div class="empty-text">등록된 내역이 없습니다</div>
            <div class="empty-subtext">새로운 심부름을 등록해보세요!</div>
        </div>

        <!-- 데이터가 있을 때 -->
        <div th:unless="${#lists.isEmpty(lists)}">
            <div th:each="row, loop : ${lists}"
                 class="list-item"
                 th:data-mission-seq="${row.missionSeq}"
                 onclick="goToMissionDetail(this)">

                <div class="item-number"
                     th:text="${paging.totalCount - (paging.page - 1) * paging.size - loop.index}">
                    1
                </div>

                <div class="item-content">
                    <div class="item-title" th:text="${row.missionTitle}">
                        마트에서 생필품 구매해주세요
                    </div>
                    <div class="item-meta">
                        <!-- 수행 내역일 때만 작성자 표시 -->
                        <span th:if="${history == 'performance'}">
                            <i class="fas fa-user"></i>
                            [[${row.memberId}]]
                        </span>
                        <span>
                            <i class="fas fa-calendar"></i>
                            [[${row.missionCreatDt}]]
                        </span>
                        <span th:switch="${row.missionStatus}" class="status-badge"
                              th:classappend="'status-' + ${row.missionStatus}">
                            <span th:case="0">신청</span>
                            <span th:case="1">진행중</span>
                            <span th:case="2">완료</span>
                            <span th:case="9">취소</span>
                        </span>
                    </div>
                </div>

                <div class="item-price"
                     th:text="${#numbers.formatInteger(row.missionCost, 0, 'COMMA')} + '원'">
                    15,000원
                </div>
            </div>
        </div>
    </div>

    <!-- 페이징 -->
    <div th:if="${paging != null && !#lists.isEmpty(lists)}" class="pagination-wrapper">
        <nav>
            <ul class="pagination">
                <!-- 이전 블록 -->
                <li class="page-item" th:classappend="${!paging.hasPrev} ? 'disabled'">
                    <a class="page-link"
                       th:if="${paging.hasPrev}"
                       th:href="@{/zipkok/mission/add(flag=${flag}, page=${paging.startPage - 1}, search=${search}, status=${status})}">
                        «
                    </a>
                    <span class="page-link" th:unless="${paging.hasPrev}">«</span>
                </li>

                <!-- 페이지 번호 -->
                <li class="page-item"
                    th:each="p : ${#numbers.sequence(paging.startPage, paging.endPage)}"
                    th:classappend="${p == paging.page} ? 'active'">
                    <a class="page-link"
                       th:href="@{/zipkok/mission/add(flag=${flag}, page=${p}, search=${search}, status=${status})}"
                       th:text="${p}">1</a>
                </li>

                <!-- 다음 블록 -->
                <li class="page-item" th:classappend="${!paging.hasNext} ? 'disabled'">
                    <a class="page-link"
                       th:if="${paging.hasNext}"
                       th:href="@{/zipkok/mission/add(flag=${flag}, page=${paging.endPage + 1}, search=${search}, status=${status})}">
                        »
                    </a>
                    <span class="page-link" th:unless="${paging.hasNext}">»</span>
                </li>
            </ul>
        </nav>
    </div>

    <!-- 하단 버튼 -->
    <div class="bottom-buttons">
        <button class="btn btn-secondary" onclick="location.href='/zipkok/member/mypage'">
            <i class="fas fa-user"></i>
            마이페이지
        </button>
        <button class="btn btn-primary" onclick="location.href='/zipkok/mission/select'">
            <i class="fas fa-plus"></i>
            새 심부름 요청
        </button>
    </div>
</div>

<script>
    // 심부름 상세 페이지로 이동
    function goToMissionDetail(element) {
        const missionSeq = element.getAttribute('data-mission-seq');
        location.href = '/zipkok/mission/request/detail?missionSeq=' + missionSeq;
    }

    function filterStatus(status) {
        const url = new URL(window.location.href);
        url.searchParams.set('status', status);
        url.searchParams.set('page', '1');
        window.location.href = url.toString();
    }

    // 상태 필터 활성화 표시
    document.addEventListener('DOMContentLoaded', function() {
        const urlParams = new URLSearchParams(window.location.search);
        const currentStatus = urlParams.get('status') || '';

        document.querySelectorAll('.status-chip').forEach(chip => {
            chip.classList.remove('active');
        });

        if(currentStatus === '') {
            document.querySelector('.status-chip').classList.add('active');
        } else {
            document.querySelectorAll('.status-chip').forEach(chip => {
                if(chip.getAttribute('onclick').includes(`'${currentStatus}'`)) {
                    chip.classList.add('active');
                }
            });
        }
    });
</script>

</body>
</html>
