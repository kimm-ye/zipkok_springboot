<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>심부름 전체 내역 - 집콕</title>
    <th:block th:replace="~{fragments/header :: header}"></th:block>
    <link rel="stylesheet" th:href="@{/css/mission/missionList.css}">
    <script type="text/javascript" th:src="@{/js/mission/history.js}"></script>
</head>
<body>

<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container">
    <!-- 헤더 -->
    <div class="page-header">
        <button class="back-btn" onclick="location.href='/zipkok/member/mypage'">
            <i class="fas fa-arrow-left" style="font-size: 18px;"></i>
        </button>
        <div class="page-title">
            <h2 th:text="${history == 'request' ? '요청 내역' : '수행 내역'}">요청 내역</h2>
            <p class="page-subtitle">전체 심부름 내역을 확인하고 관리하세요</p>
        </div>
    </div>

    <!-- 검색 및 필터 -->
    <div class="filter-section">
        <form th:action="@{/mission/history}" method="get">
            <input type="hidden" id="flag" name="flag" th:value="${flag}">

            <!-- 검색 -->
            <div class="filter-row">
                <div class="search-box">
                    <input type="text"
                           id="search"
                           name="search"
                           th:value="${search}"
                           placeholder="심부름 제목 혹은 내용으로 검색하세요...">
                    <button type="button" class="search-btn" onclick="searchMissions()">
                        <i class="fas fa-search"></i>
                    </button>
                </div>

                <select id="sortSelect" class="sort-select" onchange="searchMissions()">
                    <option value="recent" th:selected="${sort == 'recent'}">최신순</option>
                    <option value="old" th:selected="${sort == 'old'}">오래된순</option>
                    <option value="price_high" th:selected="${sort == 'price_high'}">가격높은순</option>
                    <option value="price_low" th:selected="${sort == 'price_low'}">가격낮은순</option>
                </select>
            </div>

            <!-- 상태 필터 -->
            <div class="filter-row">
                <div class="status-filters">
                    <button type="button"
                            class="status-chip"
                            th:classappend="${missionStatus == null or missionStatus == '' ? 'active' : ''}"
                            data-status=""
                            onclick="filterByStatus('')">
                        전체
                    </button>
                    <button type="button"
                            class="status-chip"
                            th:classappend="${missionStatus == '0' ? 'active' : ''}"
                            data-status="0"
                            onclick="filterByStatus('0')">
                        신청
                    </button>
                    <button type="button"
                            class="status-chip"
                            th:classappend="${missionStatus == '1' ? 'active' : ''}"
                            data-status="1"
                            onclick="filterByStatus('1')">
                        진행중
                    </button>
                    <button type="button"
                            class="status-chip"
                            th:classappend="${missionStatus == '2' ? 'active' : ''}"
                            data-status="2"
                            onclick="filterByStatus('2')">
                        완료
                    </button>
                    <button type="button"
                            class="status-chip"
                            th:classappend="${missionStatus == '9' ? 'active' : ''}"
                            data-status="9"
                            onclick="filterByStatus('9')">
                        취소
                    </button>
                </div>
            </div>
        </form>
    </div>

    <!-- 목록 영역 (Fragment) -->
    <div id="missionListContainer">
        <div th:fragment="missionListFragment">
            <!-- 리스트 -->
            <div class="list-container">
                <div class="list-header">
                    <span th:text="${history == 'request' ? '내가 요청한 심부름' : '내가 수행한 심부름'}">내가 요청한 심부름</span>
                    <span class="list-count" th:if="${paging != null}">
                    총 [[${paging.totalCount}]]건
                </span>
                </div>

                <!-- 데이터가 없을 때 -->
                <div th:if="${#lists.isEmpty(lists)}" class="empty-state">
                    <div class="empty-icon">
                        <i class="fas fa-inbox"></i>
                    </div>
                    <div class="empty-text">등록된 내역이 없습니다</div>
                    <div class="empty-subtext">새로운 심부름을 등록해보세요!</div>
                </div>

                <!-- 데이터가 있을 때 -->
                <div th:unless="${#lists.isEmpty(lists)}">
                    <div th:each="row, loop : ${lists}"
                         class="list-item"
                         th:data-mission-seq="${row.missionSeq}"
                         onclick="goToMissionDetail(this)">

                        <div class="item-number"
                             th:text="${paging.totalCount - (paging.page - 1) * paging.size - loop.index}">
                            1
                        </div>

                        <div class="item-content">
                            <div class="item-title" th:text="${row.missionTitle}">
                                마트에서 생필품 구매해주세요
                            </div>
                            <div class="item-meta">
                                <!-- 수행 내역일 때만 작성자 표시 -->
                                <span th:if="${history == 'performance'}">
                                <i class="fas fa-user"></i>
                                <!--[[${row.memberId}]]-->
                            </span>
                                <span>
                                <i class="fas fa-calendar"></i>
                                [[${row.missionCreatDt}]]
                            </span>
                                <span th:switch="${row.missionStatus}" class="status-badge"
                                      th:classappend="'status-' + ${row.missionStatus}">
                                <span th:case="0">신청</span>
                                <span th:case="1">진행중</span>
                                <span th:case="2">완료</span>
                                <span th:case="9">취소</span>
                            </span>
                            </div>
                        </div>

                        <div class="item-price"
                             th:text="${#numbers.formatInteger(row.missionCost, 0, 'COMMA')} + '원'">
                            15,000원
                        </div>
                    </div>
                </div>
            </div>

            <!-- 페이징 (✅ onclick으로 변경) -->
            <div th:if="${paging != null && !#lists.isEmpty(lists)}" class="pagination-wrapper">
                <nav>
                    <ul class="pagination">
                        <!-- 이전 블록 -->
                        <li class="page-item" th:classappend="${!paging.hasPrev} ? 'disabled'">
                            <a class="page-link"
                               th:if="${paging.hasPrev}"
                               href="javascript:void(0)"
                               th:onclick="|changePage(${paging.startPage - 1})|">
                                «
                            </a>
                            <span class="page-link" th:unless="${paging.hasPrev}">«</span>
                        </li>

                        <!-- 페이지 번호 -->
                        <li class="page-item"
                            th:each="p : ${#numbers.sequence(paging.startPage, paging.endPage)}"
                            th:classappend="${p == paging.page} ? 'active'">
                            <a class="page-link"
                               href="javascript:void(0)"
                               th:onclick="|changePage(${p})|"
                               th:text="${p}">1</a>
                        </li>

                        <!-- 다음 블록 -->
                        <li class="page-item" th:classappend="${!paging.hasNext} ? 'disabled'">
                            <a class="page-link"
                               th:if="${paging.hasNext}"
                               href="javascript:void(0)"
                               th:onclick="|changePage(${paging.endPage + 1})|">
                                »
                            </a>
                            <span class="page-link" th:unless="${paging.hasNext}">»</span>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>
    <!-- 하단 버튼 -->
    <div class="bottom-buttons">
        <button class="btn btn-secondary" onclick="location.href='/zipkok/member/mypage'">
            <i class="fas fa-user"></i>
            마이페이지
        </button>
        <button class="btn btn-primary" onclick="location.href='/zipkok/mission/select'">
            <i class="fas fa-plus"></i>
            새 심부름 요청
        </button>
    </div>
</div>

<!-- 상태 필터 조회시 스켈레톤 효과 -->
<div id="skeletonTemplate" style="display:none;">
    <div th:replace="~{fragments/skeleton :: listSkeleton}"></div>
</div>


</body>
</html>
