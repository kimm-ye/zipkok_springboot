<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>로그인</title>

    <th:block th:replace="~{fragments/header :: header}"></th:block>
    <link rel="stylesheet" th:href="@{/css/member/joinmember.css}">

    <script type="text/javascript" th:src="@{/js/common.js}"></script>
    <script type="text/javascript" th:src="@{/js/member/login.js}"></script>

    <!-- 카카오 로그인 -->
    <script src="https://developers.kakao.com/sdk/js/kakao.js"></script>
    <script>
        Kakao.init('fd6202fdf742e1c361e44f8a65bdba05');  // 사용하려는 앱의 JavaScript 키 입력
    </script>
    <!-- 카카오 로그인 END -->

</head>
<body>
<!-- 로딩바 -->
<div th:replace="~{fragments/loading :: loading}"></div>

<div class="container">
    <div id="header">
        <h1 class="login_title">로그인</h1>
        <h3>Welcome! 집콕에 오신 것을 환영합니다.</h3>
    </div>

    <div id="wrapper">
        <div id="content">

            <form name="loginForm" >
                <input type="hidden" name="login_ok" value="1"/>
                <input type="hidden" name="backUrl" th:value="${param.backUrl}"/>

                <div>
                    <h3 class="join_title"><label for="id">아이디</label></h3>
                    <span class="box int_id">
                        <input type="text" id="id" class="join_H" maxlength="30" name="id" value="admin" required>
                    </span>

                    <h3 class="join_title"><label for="pass">비밀번호</label></h3>
                    <span class="box int_pass">
                        <input type="password" id="pass" class="join_H" maxlength="16" name="pass" value="1111" required>
                        <span id="alertTxt">사용불가</span>
                        <img th:src="@{/img/login/m_icon_pass.png}" id="pass1_img" class="passImg">
                    </span>

                    <span style="font-size:1.5em; color:red;" th:text="${LoginNG}"></span>

                    <div class="btn_area">
                        <p style="text-align: right;"><a th:href="@{/member/find}">아이디/비밀번호 찾기</a></p>
                        <input type="button" class="loginBtn" value="로그인" onclick="validateLoginForm(this.form)">
                        <br>
                        <button type="button" class="joinBtn" th:onclick="'location.href=\'/zipkok/member/join\''">
                            <span>회원가입</span>
                        </button>
                        <br>
                        <div id="kakaologin">
                            <form id="kakaoForm" class="kakaobtn">
                                <input type="hidden" name="kakaoemail" id="kakaoemail" value=""/>
                                <input type="hidden" name="kakaoname" id="kakaoname" value=""/>
                                <input type="hidden" name="isKakao" id="isKakao" value="1"/>
                                <a id="kakao-login-btn" href="javascript:loginWithKakao()">
                                    <img th:src="@{/img/login/kakao_login_medium_wide.png}" style="width: 100%;" alt="카카오 로그인" />
                                </a>
                            </form>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
