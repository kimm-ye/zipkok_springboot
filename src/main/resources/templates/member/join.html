<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${isModify} ? '회원정보 수정' : '회원가입'">회원가입</title>
    <th:block th:replace="~{fragments/header :: header}"></th:block>
    <link rel="stylesheet" th:href="@{/css/member/joinmember.css}">

    <!-- 수정 모드 데이터 전달 -->
    <script th:inline="javascript" th:if="${isModify}">
        /*<![CDATA[*/
        window.memberData = {
            info: /*[[${info}]]*/ null,
            isModify: /*[[${isModify}]]*/ false
        };
        /*]]>*/
    </script>

    <script type="text/javascript" th:src="@{/js/member/join.js}"></script>
    <script type="text/javascript" th:src="@{/js/member/login.js}"></script>
</head>
<body>
<!-- 로딩바 -->
<div th:replace="~{fragments/loading :: loading}"></div>

<div class="container">
    <!-- header -->
    <div id="header">
        <h1 class="join_title">
            <label><strong th:text="${isModify} ? '회원정보 수정' : '회원가입'">회원가입</strong></label>
        </h1>
        <h3 th:text="${isModify} ? '' : 'Welcome! 집콕에 오신 것을 환영합니다.'">Welcome! 집콕에 오신 것을 환영합니다.</h3>
    </div>

    <!-- wrapper in -->
    <div id="wrapper">

        <!-- content in -->
        <div id="content">

            <!-- form in -->
            <form name="joinForm"
                  onsubmit="return submitFormWithFetch(this);"
                  enctype="multipart/form-data">

                <!-- 회원 유형 선택 (수정 모드에서는 숨김) -->
                <div th:unless="${isModify}"
                     style="margin-bottom: 30px; text-align: center; padding: 20px; border: 2px solid #ddd; border-radius: 10px;">
                    <h3 class="join_title" style="margin-bottom: 20px;">가입 유형을 선택해주세요</h3>
                    <label style="margin-right: 30px; font-size: 18px;">
                        <input type="radio" name="memberRole" value="1" onchange="toggleMemberType()" checked>
                        &nbsp;<strong>일반 사용자</strong>
                    </label>
                    <label style="font-size: 18px;">
                        <input type="radio" name="memberRole" value="2" onchange="toggleMemberType()">
                        &nbsp;<strong>셔틀콕 (헬퍼)</strong>
                    </label>
                </div>

                <!-- 수정 모드에서는 hidden으로 회원 유형 전달 -->
                <input type="hidden"
                       name="memberRole"
                       th:if="${isModify}"
                       th:value="${info?.memberRole}">
                <input type="hidden"
                       name="memberSeq"
                       th:if="${isModify}"
                       th:value="${info?.memberSeq}">

                <!-- NAME -->
                <div>
                    <h3 class="join_title">
                        <label for="name">이름</label>
                    </h3>
                    <span class="box int_name">
                        <input type="text"
                               id="name"
                               class="join_H"
                               maxlength="20"
                               name="memberName"
                               placeholder="이름을 입력하세요"
                               th:readonly="${isModify}"
                               th:value="${info?.memberName}"
                               required>
                    </span> <span class="error_next_box"></span>
                </div>

                <!-- ID -->
                <div>
                    <h3>아이디</h3>
                    <div class="box int_id">
                        <input type="text"
                               id="memberId"
                               name="memberId"
                               class="join_H"
                               maxlength="12"
                               placeholder="아이디를 입력하세요"
                               th:value="${info?.memberId}"
                               th:readonly="${isModify}"
                               th:style="${isModify} ? 'background-color: #f5f5f5; cursor: not-allowed;' : ''">
                    </div>
                    <span id="idCheckMsg"
                          class="error_next_box"
                          th:style="${isModify} ? 'display: none;' : ''"></span>
                    <input type="hidden"
                           name="idDuplication"
                           th:value="${isModify} ? 'idCheck' : 'idUncheck'">
                </div>

                <!-- pass1 -->
                <div>
                    <h3 class="join_title">
                        <label for="memberPass"
                               th:text="${isModify} ? '비밀번호 (변경시에만 입력)' : '비밀번호'">비밀번호</label>
                    </h3>
                    <span class="box int_pass">
                        <input type="password"
                               id="memberPass"
                               class="join_H"
                               maxlength="16"
                               name="memberPass"
                               th:placeholder="${isModify} ? '변경하려면 입력하세요' : '비밀번호를 입력하세요'"
                               th:required="${!isModify}">
                        <span id="alertTxt"></span>
                        <img th:src="@{/img/login/m_icon_pass.png}" id="pass1_img" class="passImg">
                    </span>
                    <div class="password-hint" id="passwordHint">
                        8자 이상, 특수문자(!@#$%^&*), 숫자, 영문자 포함 필수
                    </div>
                    <span class="error_next_box"></span>
                </div>

                <!-- pass2 -->
                <div>
                    <h3 class="join_title">
                        <label for="memberPass2">비밀번호 확인</label>
                    </h3>
                    <span class="box int_pass_check">
                        <input type="password"
                               id="memberPass2"
                               class="join_H"
                               maxlength="16"
                               name="memberPass2"
                               th:placeholder="${isModify} ? '변경하려면 다시 입력하세요' : '비밀번호를 다시 입력하세요'"
                               th:required="${!isModify}">
                        <img th:src="@{/img/login/m_icon_check_disable.png}" id="pass2_img" class="passImg">
                    </span>
                    <div class="password-hint" id="confirmHint"></div>
                    <span class="error_next_box"></span>
                </div>

                <!-- Email -->
                <div class="emailDiv">
                    <h3 class="join_title">
                        <label>이메일</label>
                    </h3>
                    <span class="box_email">
                        <input type="text"
                               id="email_1"
                               class="join_email"
                               maxlength="30"
                               name="email_1"
                               th:value="${info?.memberEmail != null} ? ${#strings.substringBefore(info.memberEmail, '@')} : ''"
                               required>
                    </span>
                    &nbsp;@
                    <span class="box_email">
                        <input type="text"
                               id="email_2"
                               class="join_email"
                               maxlength="30"
                               name="email_2"
                               th:value="${info?.memberEmail != null} ? ${#strings.substringAfter(info.memberEmail, '@')} : ''"
                               readonly
                               required>
                    </span>
                    &nbsp;
                    <span class="box_email">
                        <select name="email_check"
                                onchange="email_input(this.form);"
                                class="join_email"
                                id="email_check"
                                required>
                            <option value="">-선택-</option>
                            <option value="1">직접입력</option>
                        </select>
                    </span> <span class="error_next_box"></span>
                </div>

                <!-- age -->
                <div>
                    <h3 class="join_title">
                        <label for="age">나이 / 성별</label>
                    </h3>
                    <div id="age_wrap">

                        <div id="age">
                            <span class="box">
                                <select id="age_check" class="sel" name="memberAge" th:disabled="${isModify}" th:style="${isModify} ? 'background-color: #f5f5f5; cursor: not-allowed;' : ''" required>
                                    <option value="">-나이 선택-</option>
                                    <option value="10" th:selected="${info?.memberAge == '10'}">10대</option>
                                    <option value="20" th:selected="${info?.memberAge == '20'}">20대</option>
                                    <option value="30" th:selected="${info?.memberAge == '30'}">30대</option>
                                    <option value="40" th:selected="${info?.memberAge == '40'}">40대</option>
                                    <option value="50" th:selected="${info?.memberAge == '50'}">50대</option>
                                    <option value="60" th:selected="${info?.memberAge == '60'}">60대</option>
                                    <option value="0" th:selected="${info?.memberAge == '0'}">기타</option>
                                </select>
                            </span>
                        </div>

                        <!-- GENDER -->
                        <div id="gender">
                            <span class="box gender_code">
                                <select id="memberGender" class="sel" name="memberGender" th:disabled="${isModify}" th:style="${isModify} ? 'background-color: #f5f5f5; cursor: not-allowed;' : ''" required>
                                    <option value="">-성별 선택-</option>
                                    <option value="1" th:selected="${info?.memberGender == 1}">남자</option>
                                    <option value="2" th:selected="${info?.memberGender == 2}">여자</option>
                                </select>
                            </span>
                            <span class="error_next_box">필수 정보입니다.</span>
                        </div>

                    </div>

                    <span class="error_next_box"></span>
                </div>

                <!-- phone -->
                <div>
                    <h3 class="join_title">
                        <label for="phone">휴대전화</label>
                    </h3>
                    <span class="box int_phone">
                        <input type="text"
                               oninput="this.value = this.value.replace(/[^0-9]/g, '')"
                               id="phone"
                               class="join_H"
                               maxlength="11"
                               placeholder="휴대전화 입력"
                               name="memberPhone"
                               th:value="${info?.memberPhone}"
                               required>
                        <span class="step_url">'-' 생략</span>
                    </span> <span class="error_next_box"></span>
                </div>

                <div>
                    <h3 class="join_title"><label>프로필사진</label></h3>
                    <span class="box int_picture">


                        <!-- 새 이미지 업로드 -->
                        <input type="file"
                               name="attachFile"
                               id="attachFile"
                               accept="image/png, image/jpeg"
                               onchange="previewImage(event)">
                        <small th:if="${isModify}">새 이미지를 선택하면 기존 이미지가 교체됩니다.</small>

                        <!-- 기존 프로필 사진 표시 (수정 모드) -->
                        <div th:if="${isModify}" class="current-image" id="currentProfileContainer">
                            <img th:src="@{/member/image/profile/{memberSeq}(memberSeq=${info.memberSeq}, v=${info.imageVersion})}"
                                 id="currentProfileImage"
                                 alt="현재 프로필"
                                 style="max-width: 100px; max-height: 100px; margin-bottom: 10px;">
                            <p>현재 프로필:
                                <span th:text="${info.imageDTO != null ? info.imageDTO.fullImageName : 'default.png'}"></span>
                            </p>
                        </div>

                        <!-- 미리보기 영역 -->
                        <div id="previewContainer" style="margin-top: 10px; display: none;">
                            <img id="previewImage"
                                 alt="미리보기"
                                 style="max-width: 100px; max-height: 100px; border: 1px solid #ccc;"
                                 onerror="this.src='/img/profile/default.png'"/> <!-- 기본 이미지마저 로딩 실패할 경우 무한 루프 방지-->
                            <p style="font-size: 12px; color: #666;">선택한 이미지 미리보기</p>
                        </div>
                    </span>
                </div>

                <!-- 헬퍼 전용 필드들 -->
                <div id="helper_fields"
                     th:style="${info?.memberRole == 2} ? 'display: block;' : 'display: none;'">

                    <!-- bank -->
                    <div>
                        <h3 class="join_title">
                            <label for="bank">입금계좌 은행</label>
                        </h3>
                        <div id="bank_wrap">
                            <div id="bank">
                                <span class="box">
                                    <select id="memberBank" class="sel" name="memberBank" onchange="input_bank(this.form)">
                                        <option value="">은행선택</option>
                                        <option value="003" th:selected="${info?.memberBank == '003'}">기업은행</option>
                                        <option value="001" th:selected="${info?.memberBank == '001'}">국민은행</option>
                                        <option value="020" th:selected="${info?.memberBank == '020'}">우리은행</option>
                                        <option value="011" th:selected="${info?.memberBank == '011'}">신한은행</option>
                                        <option value="004" th:selected="${info?.memberBank == '004'}">농협은행</option>
                                        <option value="023" th:selected="${info?.memberBank == '023'}">SC은행</option>
                                        <option value="099" th:selected="${info?.memberBank == '099'}">카카오뱅크</option>
                                    </select>
                                </span> <span class="error_next_box">하나는 필수 선택.</span>
                            </div>
                        </div>
                    </div>

                    <!-- account -->
                    <div>
                        <h3 class="join_title">
                            <label for="account">계좌번호</label>
                        </h3>
                        <span class="box int_phone">
                            <input type="text"
                                   id="account"
                                   class="join_H"
                                   placeholder="계좌번호 입력"
                                   name="memberAccount"
                                   th:value="${info?.memberAccount}"
                                   th:readonly="${info?.memberBank == null or info?.memberBank == ''}">
                            <span class="step_url">'-' 생략</span>
                        </span> <span class="error_next_box"></span>
                    </div>

                    <!-- vehicle -->
                    <div>
                        <h3 class="join_title">
                            <label for="vehicle">보유중인 주요 이동수단</label>
                        </h3>
                        <div id="vehicle_wrap">
                            <div id="vehicle">
                                <span class="box">
                                    <label><input type="radio" value="1" name="memberVehicle" th:checked="${info?.memberVehicle == 1}">&nbsp;자동차&nbsp;</label>
                                    <label><input type="radio" value="2" name="memberVehicle" th:checked="${info?.memberVehicle == 2}">&nbsp;오토바이&nbsp;</label>
                                    <label><input type="radio" value="3" name="memberVehicle" th:checked="${info?.memberVehicle == 3}">&nbsp;자전거&nbsp;</label>
                                    <label><input type="radio" value="4" name="memberVehicle" th:checked="${info?.memberVehicle == 4}">&nbsp;도보&nbsp;</label>
                                    <label><input type="radio" value="5" name="memberVehicle" th:checked="${info?.memberVehicle == 5}">&nbsp;기타&nbsp;</label>
                                </span>
                            </div>
                        </div>
                    </div>

                    <!-- introduce -->
                    <div>
                        <h3 class="join_title">
                            <label for="memberIntroduce">자기소개</label>
                        </h3>
                        <span class="box int_address">
                            <input type="text"
                                   id="memberIntroduce"
                                   class="join_H"
                                   maxlength="20"
                                   placeholder="20자 이내 입력"
                                   name="memberIntroduce"
                                   th:value="${info?.memberIntroduce}">
                        </span> <span class="error_next_box"></span>
                    </div>

                    <!--<div>
                        <h3 class="join_title"><label>프로필사진</label></h3>
                        <span class="box int_picture">


                        &lt;!&ndash; 새 이미지 업로드 &ndash;&gt;
                        <input type="file"
                               name="attachFile"
                               id="attachFile"
                               accept="image/png, image/jpeg"
                               onchange="previewImage(event)">
                        <small th:if="${isModify}">새 이미지를 선택하면 기존 이미지가 교체됩니다.</small>

                            &lt;!&ndash; 기존 프로필 사진 표시 (수정 모드) &ndash;&gt;
                        <div th:if="${isModify}" class="current-image" id="currentProfileContainer">
                            <img th:src="@{${info.getImageUrl()}}"
                                 id="currentProfileImage"
                                 alt="현재 프로필"
                                 style="max-width: 100px; max-height: 100px; margin-bottom: 10px;">
                            <p>현재 프로필: <span th:text="${info.fullImageName}"></span></p>
                        </div>

                        &lt;!&ndash; 미리보기 영역 &ndash;&gt;
                        <div id="previewContainer" style="margin-top: 10px; display: none;">
                            <img id="previewImage"
                                 alt="미리보기"
                                 style="max-width: 100px; max-height: 100px; border: 1px solid #ccc;"
                                 onerror="this.src='/img/profile/default.png'"/> &lt;!&ndash; 기본 이미지마저 로딩 실패할 경우 무한 루프 방지&ndash;&gt;
                            <p style="font-size: 12px; color: #666;">선택한 이미지 미리보기</p>
                        </div>
                    </span>
                    </div>-->

                    <!-- 헬퍼 통계 정보 (수정 모드에서만 표시) -->
                    <!--<div th:if="${isModify}" class="helper-stats" style="margin-top: 20px; padding: 15px; background-color: #f8f9fa; border-radius: 8px;">
                        <h4>헬퍼 활동 정보</h4>
                        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; margin-top: 10px;">
                            <div style="text-align: center;">
                                <div style="font-size: 24px; font-weight: bold; color: #007bff;" th:text="${info?.memberReview ?: 0}">0</div>
                                <div style="font-size: 14px; color: #666;">리뷰 수</div>
                            </div>
                            <div style="text-align: center;">
                                <div style="font-size: 24px; font-weight: bold; color: #28a745;" th:text="${info?.memberMissionC ?: 0}">0</div>
                                <div style="font-size: 14px; color: #666;">완료 미션</div>
                            </div>
                            <div style="text-align: center;">
                                <div style="font-size: 24px; font-weight: bold; color: #ffc107;" th:text="${info?.memberPoint ?: 0}">0</div>
                                <div style="font-size: 14px; color: #666;">보유 포인트</div>
                            </div>
                        </div>
                    </div>-->

                </div>
                <!-- 헬퍼 전용 필드 끝 -->

                <!-- JOIN BTN-->
                <div class="btn_area">
                    <button type="submit" class="joinBtn">
                        <span th:text="${isModify} ? '정보 수정' : '가입하기'">가입하기</span>
                    </button>
                    <button type="button"
                            th:if="${isModify}"
                            class="mt-3 joinBtn"
                            onclick="cancelModify()">
                        <span>취소</span>
                    </button>

                    <button type="button" class="homeBtn" onclick="goHome()">
                        <i class="fas fa-home"></i>
                        홈으로
                    </button>
                </div>
            </form>
            <!-- form out -->

        </div>
        <!-- content-->

    </div>
    <!-- wrapper -->

</div>
</body>
</html>
