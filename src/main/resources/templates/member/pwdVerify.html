<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 확인 - 집콕</title>
    <th:block th:replace="~{fragments/header :: header}"></th:block>
    <link rel="stylesheet" th:href="@{/css/member/pwdVerify.css}">
    <script type="text/javascript" th:src="@{/js/member/pwdVerify.js}"></script>
    <!--<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">-->
</head>
<body>

<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container">
    <div class="verify-card">
        <!-- 아이콘 -->
        <div class="lock-icon">
            <i class="fas fa-shield-alt"></i>
        </div>

        <!-- 제목 -->
        <h2 class="verify-title">보안 인증</h2>
        <p class="verify-subtitle">
            개인정보 보호를 위해<br>
            비밀번호를 다시 한 번 확인해주세요
        </p>

        <!-- 사용자 정보 -->
        <div class="user-info">
            <div class="user-avatar" th:text="${#authentication.name.substring(0,1).toUpperCase()}">
                K
            </div>
            <div class="user-details">
                <div class="user-name" th:text="${#authentication.name} + ' 님'">홍길동 님</div>
            </div>
        </div>

        <!-- 시도 횟수 경고 -->
        <div class="attempt-info" id="attemptInfo">
            <i class="fas fa-exclamation-triangle"></i>
            <span id="attemptText">5회 이상 실패 시 계정이 일시적으로 잠금됩니다.</span>
        </div>

        <!-- 에러 메시지 -->
        <div class="error-message" id="errorMessage">
            <i class="fas fa-times-circle"></i>
            <span id="errorText">비밀번호가 일치하지 않습니다.</span>
        </div>

        <!-- 폼 -->
        <form id="verifyForm" onsubmit="return submitForm(event)">
            <div class="password-input-group">
                <input
                        type="password"
                        id="password"
                        name="password"
                        class="password-input"
                        placeholder="비밀번호를 입력하세요"
                        autocomplete="current-password"
                        required
                        autofocus>
                <button type="button" class="toggle-password-btn" onclick="togglePassword()">
                    <i class="fas fa-eye" id="toggleIcon"></i>
                </button>
            </div>

            <div class="btn-group">
                <button type="button" class="btn btn-secondary" onclick="history.back()">
                    <i class="fas fa-arrow-left"></i>
                    취소
                </button>
                <button type="submit" class="btn btn-primary" id="submitBtn">
                    <i class="fas fa-check"></i>
                    확인
                </button>
            </div>
        </form>

        <!-- 도움말 -->
        <div class="help-text">
            <i class="fas fa-info-circle"></i>
            비밀번호를 잊으셨나요?
            <a href="/zipkok/member/find/pw">비밀번호 찾기</a>
        </div>
    </div>
</div>
