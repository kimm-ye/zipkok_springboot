<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/admin-header :: admin-head}">
    <title>심부름 관리 - 집콕 관리자</title>
</head>
<body class="admin-body">

<div th:replace="~{admin/fragments/admin-header :: admin-header}"></div>
<div th:replace="~{admin/fragments/admin-sidebar :: admin-sidebar}"></div>

<main class="admin-main">
    <div class="admin-container">

        <div class="page-header">
            <h2>
                <i class="fas fa-clipboard-list"></i>
                심부름 관리
            </h2>
            <p class="page-description">심부름 목록을 조회하고 관리하세요</p>
        </div>

        <!-- 검색 및 필터 -->
        <div class="filter-section">
            <div class="filter-row">
                <div class="search-box">
                    <input type="text"
                           id="searchInput"
                           th:value="${search}"
                           placeholder="제목, 내용으로 검색...">
                    <button type="button" class="search-btn" onclick="searchMissions()">
                        <i class="fas fa-search"></i>
                    </button>
                </div>

                <select id="statusSelect" class="filter-select" onchange="searchMissions()">
                    <option value="" th:selected="${status == ''}">전체 상태</option>
                    <option value="0" th:selected="${status == '0'}">신청</option>
                    <option value="1" th:selected="${status == '1'}">진행중</option>
                    <option value="2" th:selected="${status == '2'}">완료</option>
                    <option value="9" th:selected="${status == '9'}">취소</option>
                </select>
            </div>
        </div>

        <!-- 심부름 목록 -->
        <div id="missionListContainer">
            <div th:fragment="missionListFragment">

                <div class="section-card">
                    <div class="section-header">
                        <h3>심부름 목록</h3>
                        <span class="count-badge" th:if="${paging != null}">
                                총 [[${paging.totalCount}]]건
                            </span>
                    </div>

                    <div class="section-body">
                        <!-- 데이터 없음 -->
                        <div th:if="${missions == null || missions.isEmpty()}" class="empty-state">
                            <i class="fas fa-clipboard-list" style="font-size: 48px; color: #ddd;"></i>
                            <p>등록된 심부름이 없습니다</p>
                        </div>

                        <!-- 심부름 테이블 -->
                        <table th:unless="${missions == null || missions.isEmpty()}" class="admin-table">
                            <thead>
                            <tr>
                                <th>번호</th>
                                <th>제목</th>
                                <th>요청자</th>
                                <th>금액</th>
                                <th>상태</th>
                                <th>등록일</th>
                                <th>관리</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="mission, loop : ${missions}">
                                <td th:text="${paging.totalCount - (paging.page - 1) * paging.size - loop.index}">1</td>
                                <td class="text-left" th:text="${mission.missionTitle}">심부름 제목</td>
                                <td th:text="${mission.memberId}">user123</td>
                                <td th:text="${#numbers.formatInteger(mission.missionCost, 0, 'COMMA')} + '원'">10,000원</td>
                                <td>
                                            <span class="status-badge"
                                                  th:classappend="${mission.missionStatus == 0 ? 'status-waiting' :
                                                                   (mission.missionStatus == 1 ? 'status-progress' :
                                                                   (mission.missionStatus == 2 ? 'status-complete' : 'status-cancel'))}"
                                                  th:text="${mission.missionStatus == 0 ? '신청' :
                                                            (mission.missionStatus == 1 ? '진행중' :
                                                            (mission.missionStatus == 2 ? '완료' : '취소'))}">
                                                신청
                                            </span>
                                </td>
                                <td th:text="${#temporals.format(mission.createDt, 'yyyy-MM-dd')}">2025-01-10</td>
                                <td>
                                    <button class="btn-small btn-primary"
                                            th:onclick="|viewMissionDetail(${mission.missionSeq})|">
                                        <i class="fas fa-eye"></i> 상세
                                    </button>
                                    <button class="btn-small btn-danger"
                                            th:if="${mission.missionStatus != 9}"
                                            th:onclick="|deleteMission(${mission.missionSeq})|">
                                        <i class="fas fa-trash"></i> 삭제
                                    </button>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- 페이징 -->
                <div th:if="${paging != null && paging.totalPage > 0}" class="pagination-wrapper">
                    <nav>
                        <ul class="pagination">
                            <li class="page-item" th:classappend="${!paging.hasPrev} ? 'disabled'">
                                <a class="page-link"
                                   th:if="${paging.hasPrev}"
                                   href="javascript:void(0)"
                                   th:onclick="|changePage(${paging.startPage - 1})|">
                                    «
                                </a>
                                <span class="page-link" th:unless="${paging.hasPrev}">«</span>
                            </li>

                            <li class="page-item"
                                th:each="p : ${#numbers.sequence(paging.startPage, paging.endPage)}"
                                th:classappend="${p == paging.page} ? 'active'">
                                <a class="page-link"
                                   href="javascript:void(0)"
                                   th:onclick="|changePage(${p})|"
                                   th:text="${p}">1</a>
                            </li>

                            <li class="page-item" th:classappend="${!paging.hasNext} ? 'disabled'">
                                <a class="page-link"
                                   th:if="${paging.hasNext}"
                                   href="javascript:void(0)"
                                   th:onclick="|changePage(${paging.endPage + 1})|">
                                    »
                                </a>
                                <span class="page-link" th:unless="${paging.hasNext}">»</span>
                            </li>
                        </ul>
                    </nav>
                </div>

            </div>
        </div>

    </div>
</main>

<script th:replace="~{admin/fragments/admin-sidebar :: sidebar-script}"></script>

<script>
    function searchMissions() {
        loadMissions(1);
    }

    function changePage(page) {
        loadMissions(page);
    }

    async function loadMissions(page) {
        const search = document.getElementById('searchInput').value.trim();
        const status = document.getElementById('statusSelect').value;

        const params = new URLSearchParams({
            page: page,
            search: search,
            status: status,
            isAjax: true
        });

        const displayParams = new URLSearchParams({
            page: page,
            ...(search && { search: search }),
            ...(status && { status: status })
        });

        const newUrl = `/admin/missions?${displayParams.toString()}`;
        window.history.pushState({}, '', newUrl);

        try {
            const response = await fetch(`/admin/missions?${params}`);
            const html = await response.text();
            document.getElementById('missionListContainer').innerHTML = html;
        } catch (error) {
            console.error('목록 로드 실패:', error);
            alert('목록을 불러오는데 실패했습니다.');
        }
    }

    function viewMissionDetail(missionSeq) {
        window.open(`/zipkok/mission/request/detail?missionSeq=${missionSeq}`, '_blank');
    }

    async function deleteMission(missionSeq) {
        const reason = prompt('삭제 사유를 입력해주세요:');
        if (!reason) return;

        if (!confirm('이 심부름을 삭제하시겠습니까?')) return;

        try {
            const response = await fetch(`/admin/missions/${missionSeq}`, {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ reason: reason })
            });

            const result = await response.json();

            if (result.success) {
                alert(result.message);
                loadMissions(1);
            } else {
                alert(result.message);
            }
        } catch (error) {
            console.error('삭제 실패:', error);
            alert('삭제 중 오류가 발생했습니다.');
        }
    }

    document.getElementById('searchInput')?.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            searchMissions();
        }
    });
</script>
</body>
</html>
