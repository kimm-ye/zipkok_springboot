<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="listSkeleton">
  <div class="skeleton-list">
    <div class="skeleton-item" th:each="i : ${#numbers.sequence(1,5)}">
      <div class="skeleton-number"></div>
      <div class="skeleton-content">
        <div class="skeleton-title"></div>
        <div class="skeleton-meta"></div>
      </div>
      <div class="skeleton-price"></div>
    </div>
  </div>


  <style>
    /* skeleton 공통 */
    .skeleton-item {
      display: flex;
      align-items: center;
      padding: 16px;
      margin-bottom: 12px;
      border-radius: 12px;
      background: #fff;
    }

    .skeleton-number {
      width: 32px;
      height: 24px;
      border-radius: 6px;
      margin-right: 16px;
      background: #e0e0e0;
    }

    .skeleton-content {
      flex: 1;
    }

    .skeleton-title {
      width: 60%;
      height: 18px;
      border-radius: 6px;
      margin-bottom: 8px;
      background: #e0e0e0;
    }

    .skeleton-meta {
      width: 40%;
      height: 14px;
      border-radius: 6px;
      background: #e0e0e0;
    }

    .skeleton-price {
      width: 80px;
      height: 18px;
      border-radius: 6px;
      margin-left: 16px;
      background: #e0e0e0;
    }

    /* shimmer 애니메이션 */
    .skeleton-item div {
      background: linear-gradient(
              90deg,
              #e0e0e0 25%,
              #f5f5f5 37%,
              #e0e0e0 63%
      );
      background-size: 400% 100%;
      animation: shimmer 1.4s ease infinite;
    }

    @keyframes shimmer {
      0% { background-position: 100% 0; }
      100% { background-position: -100% 0; }
    }

  </style>
</div>

</body>
</html>
